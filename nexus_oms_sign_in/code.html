<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nexus OMS | Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Hanken+Grotesk:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0px 10px 40px rgba(0,0,0,0.03);
        }
        .input-focus-ring:focus-within {
            border-color: #0066cc;
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.08);
        }
        body {
            background: radial-gradient(circle at 50% 50%, #f9f9fb 0%, #f2f2f7 100%);
            min-height: 100vh;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#883700",
                    "primary-container": "#0066cc",
                    "tertiary-fixed-dim": "#ffb692",
                    "surface": "#f9f9fb",
                    "error-container": "#ffdad6",
                    "secondary-fixed-dim": "#c7c6cb",
                    "warning": "#FF9F0C",
                    "surface-bright": "#f9f9fb",
                    "on-secondary-fixed": "#1a1b1f",
                    "error": "#FF3B30",
                    "outline": "#727784",
                    "primary-fixed": "#d7e3ff",
                    "inverse-primary": "#aac7ff",
                    "on-secondary-container": "#626267",
                    "tertiary-container": "#af4900",
                    "on-primary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "glass-fill": "rgba(255, 255, 255, 0.72)",
                    "surface-container-highest": "#e2e2e4",
                    "system-background": "#FFFFFF",
                    "on-tertiary-fixed-variant": "#793000",
                    "on-primary-fixed": "#001b3e",
                    "surface-tint": "#005cba",
                    "tertiary-fixed": "#ffdbcb",
                    "ink-secondary": "#424245",
                    "ink-primary": "#1D1D1F",
                    "surface-variant": "#e2e2e4",
                    "inverse-on-surface": "#f0f0f2",
                    "success": "#34C759",
                    "secondary-container": "#e0dfe4",
                    "on-surface": "#1a1c1d",
                    "surface-container-high": "#e8e8ea",
                    "surface-container-low": "#f3f3f5",
                    "on-error": "#ffffff",
                    "on-background": "#1a1c1d",
                    "surface-secondary": "#F2F2F7",
                    "on-tertiary": "#ffffff",
                    "surface-dim": "#d9dadc",
                    "on-secondary": "#ffffff",
                    "background": "#f9f9fb",
                    "primary-fixed-dim": "#aac7ff",
                    "on-tertiary-fixed": "#341100",
                    "surface-container": "#eeeef0",
                    "on-error-container": "#93000a",
                    "on-tertiary-container": "#ffe3d6",
                    "on-secondary-fixed-variant": "#46464b",
                    "on-primary-container": "#dfe8ff",
                    "primary": "#004e9f",
                    "secondary-fixed": "#e3e2e7",
                    "inverse-surface": "#2f3132",
                    "secondary": "#5e5e63",
                    "on-primary-fixed-variant": "#00458e",
                    "outline-variant": "#c1c6d5",
                    "on-surface-variant": "#414753"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "48px",
                    "container-max": "1440px",
                    "base": "8px",
                    "gutter": "24px",
                    "margin-mobile": "20px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-xl-mobile": ["Hanken Grotesk"],
                    "display-lg": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"],
                    "headline-xl": ["Hanken Grotesk"],
                    "label-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "label-md": ["13px", {"lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "body-lg": ["17px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "headline-xl-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "1.4", "fontWeight": "500"}],
                    "headline-xl": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-sm": ["11px", {"lineHeight": "1.2", "letterSpacing": "0.03em", "fontWeight": "600"}],
                    "body-md": ["15px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "headline-lg": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
</head>
<body class="flex flex-col items-center justify-center p-gutter">
<!-- Main Content Canvas -->
<main class="w-full max-w-md animate-in fade-in slide-in-from-bottom-4 duration-1000">
<!-- Brand Identity Section -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-6 shadow-xl shadow-primary-container/20">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">dataset</span>
</div>
<h1 class="font-display-lg text-display-lg text-ink-primary tracking-tight mb-2">Nexus OMS</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enterprise Intelligence Suite</p>
</div>
<!-- Glassmorphic Login Card -->
<div class="glass-card rounded-[32px] p-10 border border-outline-variant/10">
<h2 class="font-headline-lg text-headline-lg text-ink-primary mb-8 text-center">Sign In</h2>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="email">Work Email</label>
<div class="relative group">
<input class="w-full h-14 bg-surface-container-low border-0 rounded-xl px-5 font-body-md text-body-md text-ink-primary transition-all duration-300 ring-1 ring-outline-variant/20 focus:ring-2 focus:ring-primary focus:bg-white focus:shadow-sm outline-none" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Password</label>
<a class="font-label-md text-label-md text-primary-container hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative group">
<input class="w-full h-14 bg-surface-container-low border-0 rounded-xl px-5 font-body-md text-body-md text-ink-primary transition-all duration-300 ring-1 ring-outline-variant/20 focus:ring-2 focus:ring-primary focus:bg-white focus:shadow-sm outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full h-14 bg-primary-container text-on-primary font-headline-md text-headline-md rounded-xl shadow-lg shadow-primary-container/25 hover:opacity-90 active:scale-[0.98] transition-all duration-200 mt-4" type="button">
                    Sign In
                </button>
</form>
<div class="mt-8 pt-8 border-t border-outline-variant/10 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    New to Nexus? 
                    <a class="text-primary-container font-semibold hover:underline" href="#">Create an account</a>
</p>
</div>
</div>
<!-- Secondary Actions / Info -->
<div class="mt-12 flex flex-col items-center gap-6">
<div class="flex items-center gap-2 bg-surface-container/50 px-4 py-2 rounded-full border border-outline-variant/10">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-widest uppercase">Powered by Luminous AI</span>
</div>
<nav class="flex gap-8">
<a class="font-label-sm text-label-sm text-outline hover:text-ink-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-outline hover:text-ink-primary transition-colors" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-outline hover:text-ink-primary transition-colors" href="#">Enterprise Support</a>
</nav>
</div>
</main>
<!-- Visual Background Element (Atmospheric Gradient) -->
<div class="fixed -z-10 top-0 left-0 w-full h-full pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary-fixed-dim/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-tertiary-fixed-dim/10 blur-[120px] rounded-full"></div>
</div>
<script>
        // Simple micro-interaction for tactile response on the button
        document.querySelector('button').addEventListener('click', function(e) {
            const btn = e.currentTarget;
            btn.style.transform = 'scale(0.96)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
            }, 100);
        });

        // Background parallax effect
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const gradients = document.querySelectorAll('.fixed > div');
            gradients[0].style.transform = `translate(${x * 30}px, ${y * 30}px)`;
            gradients[1].style.transform = `translate(${-x * 30}px, ${-y * 30}px)`;
        });
    </script>
</body></html>
